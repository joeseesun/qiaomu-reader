name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-local-tts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tests/tts-local-runtime.test.py
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -B tests/tts-local-runtime.test.py
      - run: npm run check:i18n
      - name: Build standard assets within the 4.8 MB budget
        run: npm run build
      - run: npm run verify:release
      - run: npx eslint src/ --max-warnings=0
      - name: Verify committed build artifact
        run: git diff --exit-code -- main.js styles.css
      - name: Verify community budget and exclude the ACP installer
        run: npm run build:community
