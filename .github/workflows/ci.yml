name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -B tests/tts-local-runtime.test.py
      - run: npm run check:i18n
      - run: npm run build
      - run: npm run verify:release
      - run: npx eslint src/ --max-warnings=0
      - name: Verify committed build artifact
        run: git diff --exit-code -- main.js styles.css
      - name: Verify community candidate excludes the ACP installer
        run: npm run build:community
