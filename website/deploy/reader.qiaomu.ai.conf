# Nginx static site for https://reader.qiaomu.ai (aaPanel vhost directory).
server {
    listen 80;
    server_name reader.qiaomu.ai;
    root /www/wwwroot/reader.qiaomu.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/reader.qiaomu.ai;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/reader.qiaomu.ai.log;
    error_log /www/wwwlogs/reader.qiaomu.ai.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reader.qiaomu.ai;
    root /www/wwwroot/reader.qiaomu.ai;
    index index.html;
    charset utf-8;
    etag on;

    ssl_certificate /etc/letsencrypt/live/reader.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497 https://$host$request_uri;
    error_page 404 /404.html;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/reader.qiaomu.ai;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    access_log /www/wwwlogs/reader.qiaomu.ai.log;
    error_log /www/wwwlogs/reader.qiaomu.ai.error.log;
}
